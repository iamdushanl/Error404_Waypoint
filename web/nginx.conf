# ============================================================
# Waypoint Web Console — nginx server block
#
# SPA routing: all unknown paths fall back to index.html
# so that React Router (or any client-side routing) works
# correctly without 404s on hard refresh.
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long-lived cache headers.
    # Vite fingerprints asset filenames so it is safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — any path that doesn't map to a real file is served
    # as index.html so the client-side router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching of index.html itself so deployments propagate quickly.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Standard security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression for text-based assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
